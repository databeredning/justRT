name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      JUSTRT_GDB: gdb-multiarch
      JUSTRT_MAKE: make
      JUSTRT_QEMU: qemu-system-arm
      JUSTRT_SIZE: arm-none-eabi-size
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Arm and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gcc-arm-none-eabi gdb-multiarch qemu-system-arm

      - name: Verify and record tool versions
        run: python tools/check_ci_tool_versions.py --output artifacts/tool-versions.txt

      - name: Validate kernel configurations
        shell: bash
        run: |
          set -o pipefail
          python tools/test_config_builds.py 2>&1 | tee artifacts/config-tests.log

      - name: Build release targets
        shell: bash
        run: |
          set -o pipefail
          make -B BUILD=release TARGET=s32k312 TEST=simple 2>&1 | tee artifacts/s32k312-release-build.log
          make -B BUILD=release TARGET=qemu-mps2-an385 TEST=simple 2>&1 | tee artifacts/qemu-release-build.log

      - name: Run complete QEMU release suite
        shell: bash
        run: |
          set -o pipefail
          python tools/run_qemu_tests.py --quiet-build --build release 2>&1 | tee artifacts/qemu-release-tests.log

      - name: Record release sizes
        if: always()
        shell: bash
        run: |
          {
            echo "S32K312 release"
            arm-none-eabi-size bin/release/justrt.elf
            echo
            echo "QEMU Cortex-M3 release"
            arm-none-eabi-size bin/qemu-mps2-an385/release/justrt.elf
          } | tee artifacts/release-sizes.txt

      - name: Archive release validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: justrt-release-validation
          if-no-files-found: error
          path: |
            artifacts/
            bin/release/justrt.elf
            bin/release/justrt.map
            bin/release/justrt.bin
            bin/release/justrt.hex
            bin/qemu-mps2-an385/release/justrt.elf
            bin/qemu-mps2-an385/release/justrt.map
            bin/qemu-mps2-an385/release/justrt.bin
            bin/qemu-mps2-an385/release/justrt.hex
